# ============================================================
# Agri-Energy Desk — UAT vhost
#   https://menu.smartcollect.co.ug
#
# One origin, two upstreams:
#
#   /api/v1/*      → Laravel (php-fpm)
#   /storage/*     → uploaded media, straight off disk
#   /up            → Laravel health check
#   everything else → Next.js on 127.0.0.1:3000 (agrienergy-ui.service)
#
# Because the UI and the API share an origin there is no CORS config
# anywhere, and the browser calls /api/v1 directly.
#
# This is the NODE-SERVER variant: pages are rendered per request against
# the loopback API listener at the bottom of this file, so the first byte
# already contains the content.
#
# There is now a second, simpler option — menu.smartcollect.co.ug.static.conf
# — which serves the static export off disk with no Node process at all.
# That variant used to be rejected because the export was frozen at build
# time; it no longer is. The export carries no records, and every page
# fetches /api/v1 from the browser, so an approval shows up on the next page
# load either way. Choose on operational grounds:
#
#   this file    — content in the initial HTML (better for crawlers and for
#                  first paint on slow devices); needs Node running.
#   static.conf  — nginx + PHP only; one artefact deploys anywhere; content
#                  arrives a moment after first paint.
#
# Install:  /etc/nginx/sites-available/menu.smartcollect.co.ug
#   ln -s ../sites-available/menu.smartcollect.co.ug /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name menu.smartcollect.co.ug;

    # certbot writes its challenge here before the redirect applies
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name menu.smartcollect.co.ug;

    # --- TLS (certbot fills these in / manages renewal) ---------------
    ssl_certificate     /etc/letsencrypt/live/menu.smartcollect.co.ug/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/menu.smartcollect.co.ug/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Laravel's docroot. The exported frontend lives under ./static.
    root /var/www/agrienergy/repo/api/public;
    index index.php;

    charset utf-8;
    server_tokens off;

    # Media uploads and XLSX/PDF exports can be chunky.
    client_max_body_size 32m;

    access_log /var/log/nginx/agrienergy.access.log;
    error_log  /var/log/nginx/agrienergy.error.log;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/geo+json text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # ── Laravel: REST API ────────────────────────────────────────────
    # Must stay `^~ /api/v1` so it is matched before the SPA fallback,
    # or API calls would be answered with the HTML shell.
    location ^~ /api/v1 {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Laravel: health check (bootstrap/app.php `health: '/up'`) ────
    location = /up {
        try_files $uri /index.php?$query_string;
    }

    # ── Laravel: uploaded media (php artisan storage:link) ───────────
    # MediaController returns APP_URL/storage/... so these must resolve
    # on this same host. Uploads are same-origin with the app now, which
    # is why MediaController rejects SVG — do not re-add it.
    location ^~ /storage/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ── Frontend: hashed, immutable build assets ─────────────────────
    # Next already sends `public, max-age=31536000, immutable` for these,
    # so this block only silences the access log and keeps the buffers
    # off the proxy's hot path.
    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location ~ ^/index\.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
    }

    # Nothing else may reach PHP.
    location ~ \.php$ {
        return 404;
    }

    # ── Frontend: Next.js server ─────────────────────────────────────
    # Every page is rendered on demand, so a record published a second
    # ago is already on the site. Next owns its own 404s and its own
    # Cache-Control headers — do not add `add_header` here, it would
    # override what the app sets per route.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # $host, not $proxy_host: Next builds absolute URLs and reads the
        # forwarded proto to know it is behind TLS. Without these the app
        # would emit http:// links on an https:// site.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # A page render waits on a Laravel round trip; the default 60s
        # read timeout is generous enough, but fail fast on connect so a
        # dead Node process returns 502 instead of hanging the browser.
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;

        # Buffering on: these are HTML documents, not streams, and it
        # keeps slow clients off the Node event loop.
        proxy_buffering on;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

# ============================================================
# Internal loopback listener for Laravel.
#
# This is now on the RUNTIME hot path, not just the build. The Next
# server renders every public page against http://127.0.0.1:8080/api/v1
# (API_URL in deploy/env/ui.env.production), which skips TLS and a public
# round-trip. If this listener is down, public pages render empty —
# apiGet swallows the error and falls back. The browser still talks to
# /api/v1 on the public host directly for admin and partner calls.
#
# Bound to 127.0.0.1 only, so it is not reachable from outside the
# droplet. Keep the firewall closed on 8080 regardless.
# ============================================================
server {
    listen 127.0.0.1:8080;
    server_name localhost;

    root /var/www/agrienergy/repo/api/public;
    index index.php;

    client_max_body_size 32m;
    access_log off;
    error_log /var/log/nginx/agrienergy.internal.error.log;

    location ^~ /api/v1 {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /up {
        try_files $uri /index.php?$query_string;
    }

    location ~ ^/index\.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Present this loopback request to Laravel as if it arrived on
        # the public HTTPS host. Without this, signed URLs generated
        # here — notably the email-verification link built during
        # registration — would be rooted at http://127.0.0.1:8080 and
        # would fail signature validation when opened publicly.
        fastcgi_param HTTPS       on;
        fastcgi_param HTTP_HOST   menu.smartcollect.co.ug;
        fastcgi_param SERVER_NAME menu.smartcollect.co.ug;
        fastcgi_param SERVER_PORT 443;
        fastcgi_read_timeout 120s;
    }

    location / {
        return 404;
    }
}
