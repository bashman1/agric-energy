# ============================================================
# Agri-Energy Desk — UAT vhost
#   https://menu.smartcollect.co.ug
#
# One origin, Laravel only. There is no Node process in production:
# the frontend is a Next.js STATIC EXPORT installed into
# repo/api/public/static by deploy/scripts/build-ui.sh.
#
#   /api/v1/*        → Laravel (php-fpm)
#   /storage/*       → uploaded media, straight off disk
#   /up              → Laravel health check
#   /static/_next/*  → immutable build assets, straight off disk
#   everything else  → prerendered HTML from api/public/static
#
# Because the UI and the API share an origin there is no CORS config
# anywhere, and the browser calls /api/v1 directly.
#
# nginx answers every frontend path off disk, so PHP is never involved
# in serving a page. api/app/Http/Controllers/StaticSiteController.php
# implements the same resolution order as a fallback for `artisan serve`.
#
# Install:  /etc/nginx/sites-available/menu.smartcollect.co.ug
#   ln -s ../sites-available/menu.smartcollect.co.ug /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name menu.smartcollect.co.ug;

    # certbot writes its challenge here before the redirect applies
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name menu.smartcollect.co.ug;

    # --- TLS (certbot fills these in / manages renewal) ---------------
    ssl_certificate     /etc/letsencrypt/live/menu.smartcollect.co.ug/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/menu.smartcollect.co.ug/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Laravel's docroot. The exported frontend lives under ./static.
    root /var/www/agrienergy/repo/api/public;
    index index.php;

    charset utf-8;
    server_tokens off;

    # Media uploads and XLSX/PDF exports can be chunky.
    client_max_body_size 32m;

    access_log /var/log/nginx/agrienergy.access.log;
    error_log  /var/log/nginx/agrienergy.error.log;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/geo+json text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # ── Laravel: REST API ────────────────────────────────────────────
    # Must stay `^~ /api/v1` so it is matched before the SPA fallback,
    # or API calls would be answered with the HTML shell.
    location ^~ /api/v1 {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Laravel: health check (bootstrap/app.php `health: '/up'`) ────
    location = /up {
        try_files $uri /index.php?$query_string;
    }

    # ── Laravel: uploaded media (php artisan storage:link) ───────────
    # MediaController returns APP_URL/storage/... so these must resolve
    # on this same host. Uploads are same-origin with the app now, which
    # is why MediaController rejects SVG — do not re-add it.
    location ^~ /storage/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ── Frontend: hashed, immutable build assets ─────────────────────
    # Content-hashed filenames, so they can be cached forever. Resolves
    # against the server root: api/public/static/_next/...
    location ^~ /static/_next/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/index\.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
    }

    # Nothing else may reach PHP.
    location ~ \.php$ {
        return 404;
    }

    # ── Frontend: prerendered pages ──────────────────────────────────
    # The export is directory-style (trailingSlash: true), so /projects
    # is api/public/static/projects/index.html.
    #
    # 404.html is Next's exported not-found page AND the SPA shell: it
    # boots the client router, so client-only routes that were never
    # prerendered (deep links into /admin, say) still render.
    location / {
        root /var/www/agrienergy/repo/api/public/static;
        try_files $uri $uri/index.html $uri.html =404;

        # HTML must revalidate or a deploy leaves stale pages pinned in
        # browser caches; only the hashed assets above are immutable.
        add_header Cache-Control "no-cache, must-revalidate";
    }

    error_page 404 /404.html;
    location = /404.html {
        root /var/www/agrienergy/repo/api/public/static;
        internal;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

# ============================================================
# Internal loopback listener for Laravel.
#
# Only used at BUILD time: deploy/scripts/build-ui.sh prerenders the
# public pages against http://127.0.0.1:8080/api/v1, which skips TLS
# and a public round-trip. Nothing needs it at runtime any more — the
# browser talks to /api/v1 on the public host directly.
#
# Bound to 127.0.0.1 only, so it is not reachable from outside the
# droplet. Keep the firewall closed on 8080 regardless.
# ============================================================
server {
    listen 127.0.0.1:8080;
    server_name localhost;

    root /var/www/agrienergy/repo/api/public;
    index index.php;

    client_max_body_size 32m;
    access_log off;
    error_log /var/log/nginx/agrienergy.internal.error.log;

    location ^~ /api/v1 {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /up {
        try_files $uri /index.php?$query_string;
    }

    location ~ ^/index\.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Present this loopback request to Laravel as if it arrived on
        # the public HTTPS host. Without this, signed URLs generated
        # here — notably the email-verification link built during
        # registration — would be rooted at http://127.0.0.1:8080 and
        # would fail signature validation when opened publicly.
        fastcgi_param HTTPS       on;
        fastcgi_param HTTP_HOST   menu.smartcollect.co.ug;
        fastcgi_param SERVER_NAME menu.smartcollect.co.ug;
        fastcgi_param SERVER_PORT 443;
        fastcgi_read_timeout 120s;
    }

    location / {
        return 404;
    }
}
