# ============================================================
# Agri-Energy Desk — UAT vhost, STATIC EXPORT variant
#   https://menu.smartcollect.co.ug
#
# Serves the exported frontend straight off disk from api/public/static.
# There is no Node process: nothing renders server-side, so this host needs
# only nginx, PHP-FPM and PostgreSQL. That is the point of the export —
# one artefact, deployable to any environment.
#
# The site is still LIVE, not a snapshot. Every page fetches /api/v1 from
# the browser at runtime, so content approved in the admin panel is on the
# public site on the next page load. The build carries no records at all
# (see deploy/scripts/build-static.sh), so a rebuild is only ever needed
# when the UI source changes.
#
#   /api/v1/*   → Laravel (php-fpm)
#   /storage/*  → uploaded media, off disk
#   /up         → Laravel health check
#   /_next/*    → hashed build assets, off disk
#   everything else → static/ off disk, falling back to Laravel's
#                     StaticSiteController for record URLs
#
# The fallback is the important part. A URL like /projects/some-slug has no
# file of its own — the export ships ONE shell per collection. try_files
# misses, hands the request to index.php, and StaticSiteController returns
# that collection's shell with a 200. The shell reads the slug from the
# address and fetches the record. Keeping that decision in PHP rather than
# duplicating it here means there is one rule, tested in StaticSiteTest.
#
# To run the Node-server variant instead (server-rendered pages, needs
# agrienergy-ui.service), use menu.smartcollect.co.ug.conf.
#
# Install:  /etc/nginx/sites-available/menu.smartcollect.co.ug
#   ln -sf ../sites-available/menu.smartcollect.co.ug /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name menu.smartcollect.co.ug;

    # certbot writes its challenge here before the redirect applies
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name menu.smartcollect.co.ug;

    # --- TLS (certbot fills these in / manages renewal) ---------------
    ssl_certificate     /etc/letsencrypt/live/menu.smartcollect.co.ug/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/menu.smartcollect.co.ug/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Laravel's docroot. The exported frontend lives under ./static.
    root /var/www/agrienergy/repo/api/public;
    index index.php;

    charset utf-8;
    server_tokens off;

    # Media uploads and XLSX/PDF exports can be chunky.
    client_max_body_size 32m;

    access_log /var/log/nginx/agrienergy.access.log;
    error_log  /var/log/nginx/agrienergy.error.log;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/geo+json text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # ── Laravel: REST API ────────────────────────────────────────────
    # Must stay `^~ /api/v1` so it is matched before the static fallback,
    # or API calls would be answered with the HTML shell. This is the only
    # thing standing between the browser and its data — if it is wrong,
    # every page renders empty.
    location ^~ /api/v1 {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Laravel: health check (bootstrap/app.php `health: '/up'`) ────
    location = /up {
        try_files $uri /index.php?$query_string;
    }

    # ── Laravel: uploaded media (php artisan storage:link) ───────────
    # Only files that are meant to be public land here. View-only resource
    # documents deliberately do NOT — they live on the private disk and are
    # streamed through /api/v1 behind a signed URL, which is what makes the
    # restriction real. Do not add a location that exposes storage/app.
    location ^~ /storage/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ── Frontend: hashed, immutable build assets ─────────────────────
    # The export writes these to static/_next/, but references them as
    # /_next/, so the prefix has to be mapped. Content-hashed filenames, so
    # they are safe to pin for a year: a rebuild changes the name.
    location ^~ /_next/ {
        alias /var/www/agrienergy/repo/api/public/static/_next/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── The collection shells are build artefacts, not pages ─────────
    # They exist on disk, so try_files would happily serve one as a page
    # that waits forever for a record called "_entry". Refused here as well
    # as in StaticSiteController, because nginx answers first.
    location ~ ^/(projects|technologies|themes|partners|resources|events|opportunities|news)/_entry(/|$) {
        return 404;
    }

    location ~ ^/index\.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
    }

    # Nothing else may reach PHP.
    location ~ \.php$ {
        return 404;
    }

    # ── Frontend: the exported site ──────────────────────────────────
    # Exported directory-style (trailingSlash: true), so /projects/ is
    # static/projects/index.html.
    #
    # The final fallback to index.php is what serves record URLs: those have
    # no file, so Laravel's StaticSiteController decides between the
    # collection shell (200) and a real 404.
    location / {
        try_files /static$uri /static$uri/index.html /static$uri.html /index.php?$query_string;

        # HTML must revalidate or a deploy leaves stale pages — and stale
        # bundle references — pinned in browser caches. The hashed assets
        # above are the things that get cached hard, not the documents.
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
