; ============================================================
; Agri-Energy Desk — PRODUCTION php-fpm pool
; Install: /etc/php/8.3/fpm/pool.d/agrienergy.conf  (provision-prod.sh does it)
;
; Its own pool, user and socket, because the production VM hosts other
; sites: nothing here changes their pool or the global php.ini. The upload
; and memory limits UAT sets globally (provision.sh) are scoped to this pool.
; ============================================================

[agrienergy]
user = agrienergy
group = agrienergy

listen = /run/php/agrienergy.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; 3.5 GB VM shared with other sites, Jenkins and PostgreSQL.
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Media uploads and XLSX/PDF exports.
php_admin_value[upload_max_filesize] = 32M
php_admin_value[post_max_size] = 32M
php_admin_value[memory_limit] = 512M
php_admin_value[max_execution_time] = 120

php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/www/agrienergy-prod/shared/storage/logs/php-fpm.log

