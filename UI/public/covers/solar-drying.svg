<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" role="img" aria-label="Solar drying racks for grain under an open sun">
  <defs>
    <linearGradient id="dry-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="dry-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="dry-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a7f3d0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="300" height="400" fill="url(#dry-sky)"/>
  <circle cx="72" cy="80" r="40" fill="url(#dry-sun)" opacity="0.95"/>
  <g stroke="#fde68a" stroke-width="3" stroke-linecap="round" opacity="0.65">
    <line x1="72" y1="16" x2="72" y2="2"/>
    <line x1="8" y1="80" x2="-6" y2="80"/>
    <line x1="26" y1="34" x2="16" y2="24"/>
    <line x1="118" y1="34" x2="128" y2="24"/>
    <line x1="118" y1="126" x2="128" y2="136"/>
  </g>

  <path d="M0 292 Q78 262 158 284 T300 278 V400 H0 Z" fill="#166534"/>
  <path d="M0 338 Q98 312 196 332 T300 328 V400 H0 Z" fill="#15803d"/>
  <path d="M0 368 Q112 352 212 366 T300 362 V400 H0 Z" fill="#052e16"/>

  <!-- Warm air rising off the collector -->
  <g fill="none" stroke="#fde68a" stroke-width="2" stroke-linecap="round" opacity="0.45">
    <path d="M124 186 q7 -11 0 -22 q-7 -11 0 -22"/>
    <path d="M158 178 q7 -11 0 -22 q-7 -11 0 -22"/>
    <path d="M192 186 q7 -11 0 -22 q-7 -11 0 -22"/>
  </g>

  <!-- Solar dryer: raked glazing over two grain trays -->
  <g>
    <path d="M76 246 L222 246 L222 210 L76 228 Z" fill="url(#dry-glass)" stroke="#5eead4" stroke-width="1.6" stroke-linejoin="round"/>
    <g stroke="#5eead4" stroke-width="1" opacity="0.55">
      <line x1="112" y1="233" x2="112" y2="246"/>
      <line x1="149" y1="228" x2="149" y2="246"/>
      <line x1="186" y1="223" x2="186" y2="246"/>
    </g>

    <rect x="76" y="246" width="146" height="12" fill="#0b3b2e" stroke="#34d399" stroke-width="1.4"/>
    <rect x="84" y="262" width="130" height="9" fill="#0b3b2e" stroke="#34d399" stroke-width="1.2"/>

    <!-- grain on the trays -->
    <g fill="#fbbf24" opacity="0.9">
      <circle cx="92" cy="252" r="2"/><circle cx="106" cy="252" r="2"/><circle cx="120" cy="252" r="2"/>
      <circle cx="134" cy="252" r="2"/><circle cx="148" cy="252" r="2"/><circle cx="162" cy="252" r="2"/>
      <circle cx="176" cy="252" r="2"/><circle cx="190" cy="252" r="2"/><circle cx="204" cy="252" r="2"/>
    </g>
    <g fill="#fbbf24" opacity="0.6">
      <circle cx="100" cy="266" r="1.8"/><circle cx="118" cy="266" r="1.8"/><circle cx="136" cy="266" r="1.8"/>
      <circle cx="154" cy="266" r="1.8"/><circle cx="172" cy="266" r="1.8"/><circle cx="190" cy="266" r="1.8"/>
    </g>

    <g stroke="#34d399" stroke-width="2" stroke-linecap="round" opacity="0.8">
      <line x1="88" y1="271" x2="88" y2="283"/>
      <line x1="210" y1="271" x2="210" y2="283"/>
    </g>
  </g>
</svg>
