<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" role="img" aria-label="Networked solar-powered grain aggregation centres">
  <defs>
    <linearGradient id="ag-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="ag-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="300" height="400" fill="url(#ag-sky)"/>
  <circle cx="240" cy="70" r="33" fill="url(#ag-sun)" opacity="0.95"/>

  <!-- The network: two arcs tying the outer centres to the hub, drawn before
       the hills so they read as links across distance rather than as fencing. -->
  <g fill="none" stroke="#5eead4" stroke-width="1.6" stroke-dasharray="5 7" opacity="0.5">
    <path d="M60 228 C92 174 132 164 150 192"/>
    <path d="M150 192 C170 164 212 174 242 228"/>
  </g>
  <g fill="#5eead4" opacity="0.75">
    <circle cx="60" cy="228" r="3.5"/>
    <circle cx="150" cy="192" r="4"/>
    <circle cx="242" cy="228" r="3.5"/>
  </g>

  <path d="M0 288 Q80 256 160 280 T300 274 V400 H0 Z" fill="#166534"/>
  <path d="M0 330 Q100 302 200 324 T300 320 V400 H0 Z" fill="#15803d"/>
  <path d="M0 366 Q110 348 210 364 T300 360 V400 H0 Z" fill="#052e16"/>

  <!-- Central aggregation centre: pitched store with a panelled roof -->
  <g>
    <rect x="118" y="230" width="64" height="46" fill="#0b3b2e" stroke="#34d399" stroke-width="1.5"/>
    <path d="M112 230 L150 202 L188 230 Z" fill="#0b3b2e" stroke="#34d399" stroke-width="1.5" stroke-linejoin="round"/>
    <g stroke="#34d399" stroke-width="1.1" opacity="0.75">
      <line x1="132" y1="216" x2="168" y2="216"/>
      <line x1="140" y1="224" x2="160" y2="208"/>
    </g>
    <rect x="141" y="252" width="18" height="24" fill="#14532d" stroke="#34d399" stroke-width="1.1"/>
  </g>

  <!-- Two satellite stores, smaller and set back -->
  <g stroke="#34d399" stroke-width="1.3" fill="#0b3b2e">
    <path d="M45 244 a15 15 0 0 1 30 0 v32 h-30 Z"/>
    <path d="M227 244 a15 15 0 0 1 30 0 v32 h-30 Z"/>
  </g>
  <g stroke="#34d399" stroke-width="1" opacity="0.6">
    <line x1="45" y1="256" x2="75" y2="256"/>
    <line x1="227" y1="256" x2="257" y2="256"/>
  </g>
</svg>
